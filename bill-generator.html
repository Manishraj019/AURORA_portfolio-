<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURORA - Bill Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <style>
    @media print {
      @page {
        margin: 0; /* Removes browser header and footer */
      }
      body {
        background-color: white !important;
        margin: 1.5cm; /* Re-add margin to prevent clipping */
      }
      .no-print {
        display: none !important;
      }
      .print-shadow-none {
        box-shadow: none !important;
      }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-8 text-gray-800 font-sans" x-data="invoiceApp()">

  <div class="max-w-4xl mx-auto bg-white p-10 rounded-xl shadow-lg print-shadow-none">
    
    <!-- Controls (No Print) -->
    <div class="no-print mb-8 flex justify-between items-center border-b pb-4">
      <h1 class="text-2xl font-bold text-gray-800">Invoice Generator</h1>
      <button @click="window.print()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M5 4v3H4a2 2 0 00-2 2v3a2 2 0 002 2h1v2a2 2 0 002 2h6a2 2 0 002-2v-2h1a2 2 0 002-2V9a2 2 0 00-2-2h-1V4a2 2 0 00-2-2H7a2 2 0 00-2 2zm8 0H7v3h6V4zm0 8H7v4h6v-4z" clip-rule="evenodd" />
        </svg>
        Print / Save PDF
      </button>
    </div>

    <!-- Invoice Header -->
    <div class="flex justify-between items-start mb-12">
      <div class="flex items-center gap-4">
        <!-- Aurora Logo -->
        <div class="w-16 h-16">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
            <defs>
              <linearGradient id="leftGrad" x1="0%" y1="100%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#4F46E5" />
                <stop offset="30%" stop-color="#7C3AED" />
                <stop offset="100%" stop-color="#C084FC" />
              </linearGradient>
              <linearGradient id="topGrad" x1="0%" y1="100%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#9333EA" />
                <stop offset="50%" stop-color="#4F46E5" />
                <stop offset="100%" stop-color="#2563EB" />
              </linearGradient>
              <linearGradient id="rightGrad" x1="0%" y1="50%" x2="100%" y2="50%">
                <stop offset="0%" stop-color="#1E40AF" />
                <stop offset="40%" stop-color="#3B82F6" />
                <stop offset="75%" stop-color="#0EA5E9" />
                <stop offset="100%" stop-color="#06B6D4" />
              </linearGradient>
            </defs>
            <path d="M 193 760 L 315 760 L 481 477 L 359 477 Z" fill="url(#leftGrad)" />
            <path d="M 385 240 L 505 240 L 625 454 L 505 454 Z" fill="url(#topGrad)" />
            <path d="M 485 592 L 713 592 L 807 760 L 667 760 L 615 667 L 441 667 Z" fill="url(#rightGrad)" />
          </svg>
        </div>
        <div>
          <h2 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600">AURORA</h2>
          <p class="text-gray-500 text-sm mt-1">Innovative Solutions</p>
        </div>
      </div>
      <div class="text-right">
        <h2 class="text-4xl font-bold text-gray-200 uppercase tracking-wider">INVOICE</h2>
        <div class="mt-4">
          <div class="flex justify-end gap-2 text-sm text-gray-600">
            <span class="font-semibold w-24">Invoice #:</span>
            <input type="text" x-model="invoiceNumber" class="w-24 text-right border-b border-dashed border-gray-300 focus:outline-none focus:border-blue-500 bg-transparent">
          </div>
          <div class="flex justify-end gap-2 text-sm text-gray-600 mt-1">
            <span class="font-semibold w-24">Date:</span>
            <input type="date" x-model="invoiceDate" class="w-32 text-right border-b border-dashed border-gray-300 focus:outline-none focus:border-blue-500 bg-transparent">
          </div>
          <div class="flex justify-end gap-2 text-sm text-gray-600 mt-1">
            <span class="font-semibold w-24">Due Date:</span>
            <input type="date" x-model="dueDate" class="w-32 text-right border-b border-dashed border-gray-300 focus:outline-none focus:border-blue-500 bg-transparent">
          </div>
        </div>
      </div>
    </div>

    <!-- Client Info -->
    <div class="flex justify-between mb-10">
      <div class="w-1/2 pr-4">
        <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-2">Billed To</h3>
        <textarea x-model="customerInfo" rows="4" class="w-full bg-gray-50 p-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none text-gray-700" placeholder="Customer Name&#10;Company Name&#10;Address&#10;Contact Number"></textarea>
      </div>
      <div class="w-1/2 pl-4 border-l border-gray-100">
        <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-2">From</h3>
        <textarea x-model="companyInfo" rows="5" class="w-full bg-gray-50 p-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none text-gray-700 text-sm leading-relaxed" placeholder="Company Name&#10;Address&#10;Email&#10;Phone Number"></textarea>
      </div>
    </div>

    <!-- Invoice Items -->
    <div class="mb-8 overflow-hidden rounded-lg border border-gray-200">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-gray-50 border-b border-gray-200">
            <th class="py-3 px-4 text-xs font-semibold text-gray-600 uppercase">Description</th>
            <th class="py-3 px-4 text-xs font-semibold text-gray-600 uppercase w-24 text-center">Qty</th>
            <th class="py-3 px-4 text-xs font-semibold text-gray-600 uppercase w-32 text-right">Rate</th>
            <th class="py-3 px-4 text-xs font-semibold text-gray-600 uppercase w-32 text-right">Amount</th>
            <th class="py-3 px-2 w-10 no-print"></th>
          </tr>
        </thead>
        <tbody>
          <template x-for="(item, index) in items" :key="index">
            <tr class="border-b border-gray-100 hover:bg-gray-50/50 transition">
              <td class="py-3 px-4">
                <input type="text" x-model="item.description" placeholder="Item description" class="w-full border-0 border-b border-dashed border-gray-300 focus:outline-none focus:border-blue-500 bg-transparent">
              </td>
              <td class="py-3 px-4">
                <input type="number" x-model.number="item.qty" class="w-full text-center border-0 border-b border-dashed border-gray-300 focus:outline-none focus:border-blue-500 bg-transparent">
              </td>
              <td class="py-3 px-4 text-right">
                <div class="flex justify-end items-center">
                  <span class="text-gray-500 mr-1">₹</span>
                  <input type="number" x-model.number="item.rate" class="w-20 text-right border-0 border-b border-dashed border-gray-300 focus:outline-none focus:border-blue-500 bg-transparent">
                </div>
              </td>
              <td class="py-3 px-4 text-right font-medium text-gray-700">
                ₹<span x-text="(item.qty * item.rate).toFixed(2)"></span>
              </td>
              <td class="py-3 px-2 text-center no-print">
                <button @click="removeItem(index)" class="text-red-400 hover:text-red-600 transition p-1" title="Remove Item">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                  </svg>
                </button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
      
      <!-- Add Item Button -->
      <div class="p-3 bg-gray-50 no-print">
        <button @click="addItem()" class="text-blue-600 hover:text-blue-800 text-sm font-medium flex items-center gap-1 transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd" />
          </svg>
          Add New Line
        </button>
      </div>
    </div>

    <!-- Summary Section -->
    <div class="flex justify-between items-start">
      <!-- Notes -->
      <div class="w-1/2 pr-8">
        <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-2">Notes</h3>
        <textarea x-model="notes" rows="3" class="w-full bg-gray-50 p-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none text-gray-600 text-sm" placeholder="Thank you for your business..."></textarea>
      </div>
      
      <!-- Totals -->
      <div class="w-5/12 bg-gray-50 p-6 rounded-xl border border-gray-100">
        <div class="flex justify-between items-center py-2 border-b border-gray-200">
          <span class="text-gray-600 font-medium">Subtotal:</span>
          <span class="font-medium text-gray-800">₹<span x-text="subtotal.toFixed(2)"></span></span>
        </div>
        <div class="flex justify-between items-center py-2 border-b border-gray-200">
          <span class="text-gray-600 font-medium">Tax (%):</span>
          <div class="flex items-center">
            <input type="number" x-model.number="taxPercent" class="w-12 text-right border-0 border-b border-dashed border-gray-300 focus:outline-none focus:border-blue-500 bg-transparent mr-2 text-gray-800">
            <span class="font-medium text-gray-800">₹<span x-text="taxAmount.toFixed(2)"></span></span>
          </div>
        </div>
        <div class="flex justify-between items-center py-4 border-b border-gray-200">
          <span class="text-lg font-bold text-gray-800">Total Amount:</span>
          <span class="text-xl font-bold text-blue-600">₹<span x-text="total.toFixed(2)"></span></span>
        </div>
        
        <div class="flex justify-between items-center py-3 border-b border-gray-200">
          <span class="text-gray-600 font-medium">Advance Paid:</span>
          <div class="flex items-center">
            <span class="text-gray-500 mr-1">₹</span>
            <input type="number" x-model.number="advance" class="w-24 text-right border-0 border-b border-dashed border-gray-300 focus:outline-none focus:border-blue-500 bg-transparent text-gray-800 font-medium">
          </div>
        </div>
        
        <div class="flex justify-between items-center pt-4">
          <span class="text-lg font-bold text-gray-800">Payment Left:</span>
          <span class="text-2xl font-bold" :class="paymentLeft <= 0 ? 'text-green-600' : 'text-red-500'">
            ₹<span x-text="paymentLeft.toFixed(2)"></span>
          </span>
        </div>
      </div>
    </div>
    
    <!-- Footer -->
    <div class="mt-16 pt-8 border-t border-gray-200 text-center text-sm text-gray-500">
      <p>Please make checks payable to AURORA.</p>
      <p class="mt-1">Generated digitally using AURORA Billing System.</p>
    </div>

  </div>

  <script>
    function invoiceApp() {
      const today = new Date().toISOString().split('T')[0];
      const nextWeek = new Date(new Date().setDate(new Date().getDate() + 7)).toISOString().split('T')[0];
      
      return {
        invoiceNumber: 'INV-001',
        invoiceDate: today,
        dueDate: nextWeek,
        customerInfo: '',
        companyInfo: 'AURORA\n123 Tech Avenue\nInnovation District\ncontact@aurora.com\n+1 (555) 019-2023',
        notes: 'Thank you for your business. Please process this invoice within the due date.',
        taxPercent: 0,
        advance: 0,
        items: [
          { description: 'Web Development Services', qty: 1, rate: 1500 },
          { description: 'UI/UX Design', qty: 1, rate: 800 }
        ],
        addItem() {
          this.items.push({ description: '', qty: 1, rate: 0 });
        },
        removeItem(index) {
          if (this.items.length > 1) {
            this.items.splice(index, 1);
          }
        },
        get subtotal() {
          return this.items.reduce((sum, item) => sum + (item.qty * item.rate), 0);
        },
        get taxAmount() {
          return (this.subtotal * (this.taxPercent / 100));
        },
        get total() {
          return this.subtotal + this.taxAmount;
        },
        get paymentLeft() {
          const left = this.total - this.advance;
          return left > 0 ? left : 0;
        }
      }
    }
  </script>
</body>
</html>
